name: Build Rathole for mipsel (static)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:nightly          # 使用官方 nightly 镜像，Cargo 支持 2024 edition
    steps:
      - uses: actions/checkout@v4

      - name: Ensure latest nightly and rust-src
        run: |
          rustup update nightly
          rustup default nightly
          rustup component add rust-src --toolchain nightly

      - name: Build static rathole
        run: |
          cargo build --release \
            --target mipsel-unknown-linux-musl \
            -Z build-std=std,core,alloc \
            --no-default-features \
            --features "client"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rathole-mipsel-static
          path: target/mipsel-unknown-linux-musl/release/rathole
