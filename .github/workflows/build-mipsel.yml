name: Build Rathole for mipsel (static)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust nightly
        run: |
          rustup install nightly-2024-12-01
          rustup default nightly-2024-12-01
          rustup component add rust-src --toolchain nightly-2024-12-01

      - name: Build static rathole
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release \
            --target mipsel-unknown-linux-musl \
            -Z build-std=std,core,alloc \
            --no-default-features \
            --features "client"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rathole-mipsel-static
          path: target/mipsel-unknown-linux-musl/release/rathole
